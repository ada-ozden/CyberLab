services:

  juice-shop:
    image: bkimminich/juice-shop
    container_name: cyberlab-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - cyberlab

  dvwa:
    image: vulnerables/web-dvwa
    container_name: cyberlab-dvwa
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    networks:
      - cyberlab

  honeypot:
    build:
      context: ./honeypot
    container_name: cyberlab-honeypot
    ports:
      - "2222:2222"
    volumes:
      - ../data/logs:/app/logs
    restart: unless-stopped
    networks:
      - cyberlab
  capture:
    image: nicolaka/netshoot
    container_name: cyberlab-capture
    profiles: ["capture"]          # only starts when you ask for it
    network_mode: host             # on Docker Desktop this is the Linux VM, which sees every lab network
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command: ["tcpdump", "-i", "any", "-n", "-G", "300", "-w", "/pcaps/lab_%Y%m%d_%H%M%S.pcap"]
    volumes:
      - ../data/pcaps:/pcaps
  attacker:
    image: nicolaka/netshoot
    profiles: ["attack"]           # only runs when you ask for it
    networks:
      - cyberlab
    command: ["nmap", "-sS", "-p", "1-1000", "cyberlab-honeypot", "cyberlab-dvwa", "cyberlab-juice-shop"]

networks:
  cyberlab:
    driver: bridge