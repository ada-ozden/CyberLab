services:

  juice-shop:
    image: bkimminich/juice-shop
    container_name: cyberlab-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - cyberlab

  dvwa:
    image: vulnerables/web-dvwa
    container_name: cyberlab-dvwa
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    networks:
      - cyberlab

  honeypot:
    build:
      context: ./honeypot
    container_name: cyberlab-honeypot
    ports:
      - "2222:2222"
    volumes:
      - ../data/logs:/app/logs
    restart: unless-stopped
    networks:
      - cyberlab

networks:
  cyberlab:
    driver: bridge